<html><body style="font-family: -apple-system, sans-serif; font-size: 13px">
<h2>Installed</h2>
<p>Start After Effects and find <b>Real Motion Blur</b> under <b>Effect &gt; Blur &amp; Sharpen</b>.</p>
<p>If you install another version of After Effects later, run this installer again.</p>
<p>To remove it, open <i>/Library/Application Support/Real Motion Blur</i> and double-click
<b>Uninstall Real Motion Blur.command</b>.</p>
</body></html>
